# Model catalog for src/mia/llm.py. Key = "provider:model_id" (same format as prompts/*/v*.yaml).
#
# Prices: USD per 1M tokens, standard on-demand (non-batch) rate, us-east-1 for Bedrock.
# free_tier: true = we use the provider's free tier; the price is the published PAID rate,
# kept as a reference cost so model-vs-model cost comparisons stay fair.
# max_retries: extra attempts after a failed call (default 2), with exponential backoff.
# request_timeout_seconds: per-request timeout for Gemini (default 60 seconds).
#
# Sources, checked on 2026-11-15:
#   gemini  https://aistudio.google.com/docs/pricing (ai.google.dev/gemini-api/docs/pricing redirects here)
#   groq    https://console.groq.com/docs/model/openai/gpt-oss-120b
#   bedrock https://aws.amazon.com/bedrock/pricing/ (Mistral Large 3)
#           https://assets.claude.com/a04aca860a54b7323e33f449706e9b43680e1346.pdf
#           (2026-11-09 list prices, page 9: Haiku 4.5, Standard / In-Region & Geo Cross Region)
#           AWS Price List API (aws pricing get-products, AmazonBedrock, us-east-1):
#           Nova 2 Lite and Mistral Large 3
# Model IDs confirmed with real calls in task 0.6 (runs/2026-11-15_smoke-providers.jsonl).

# Gemini 3.8 Flash failed too often (503 high demand, truncated JSON, hangs), so development
# moved to Claude Haiku on Bedrock (TRD: Haiku is the conversation model).
default: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"

models:
  # gemini-2.5-flash returns 404 for new users (task 0.6). Promotional paid rate through
  # 2026-12-31; it doubles to 1.50 / 7.50 on 2027-01-01.
  "gemini:gemini-3.8-flash":
    usd_per_mtok_input: 0.75
    usd_per_mtok_output: 3.75 # includes thinking tokens
    free_tier: true
    request_timeout_seconds: 60

  "groq:openai/gpt-oss-120b":
    usd_per_mtok_input: 0.15
    usd_per_mtok_output: 0.60
    free_tier: true
    max_retries: 4 # free tier: 8,000 tokens/min, so 429s are common (TRD)

  # US cross-region inference profile ("us." prefix): 10% premium over the global rate.
  "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0":
    usd_per_mtok_input: 1.10
    usd_per_mtok_output: 5.50

  # No on-demand access with the bare id in us-east-1: US inference profile ("us."), priced as
  # in-region (the "global." profile is 0.30 / 2.50).
  "bedrock:us.amazon.nova-2-lite-v1:0":
    usd_per_mtok_input: 0.33
    usd_per_mtok_output: 2.75

  "bedrock:mistral.mistral-large-3-675b-instruct":
    usd_per_mtok_input: 0.50
    usd_per_mtok_output: 1.50

# Per-prompt override: the prompt YAMLs still say Gemini and are never edited (versioning rule).
prompt_models:
  candidate_summary: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
  follow_up: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
  interviewer: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
  judge: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
  planner: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
  report: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
  screening: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
  # Another model family generates eval answers, so the judge (Claude) never grades its own family (TRD).
  synthetic_candidate: "groq:openai/gpt-oss-120b"
