[project]
name = "mia"
version = "0.1.0"
description = "MIA — Mock Interview Assistant: AI interview simulator (portfolio project)."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
