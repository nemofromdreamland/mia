[project]
name = "mia"
version = "0.1.0"
description = "MIA — Mock Interview Assistant: AI interview simulator (portfolio project)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.3",
    "fastapi>=0.163.1",
    "langchain>=1.5.0",
    "langchain-aws>=1.9.3",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mia = "mia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia"]

[dependency-groups]
dev = [
    "bedrock-agentcore>=1.26.0",
    "httpx>=0.28.1",
    "moto[dynamodb]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mia --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["mia"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# Code blocks inside docs/specs are illustrative and hand-aligned; don't rewrite them.
exclude = ["*.md"]
